<style>
:root{--bg:#f4f1ea;--fg:#222;--mut:#6b6b6b;--pnl:#e9e4d8;--acc:#2b5fd9;--ok:#1f8a4c;--ko:#c0392b;--cw:min(28vw,150px,16.5vh);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}

.fw .big{background:linear-gradient(#fff6c2,#e6b422);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 16px #e6b42288)}.fl .big{color:#ff9a9a}.fe .big{color:#bcd4ff}
.score{font-size:clamp(34px,10vw,56px);font-weight:800}.sub{opacity:.8;font-size:15px}
.cf{position:absolute;top:-20px;width:8px;height:14px;animation:caer linear forwards}@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>

<div id="est"></div><div class="o"><span id="cnt"></span> · <label class="btn" style="display:inline-block">Cargar cartas<input type="file" id="f2" accept=".json,.xlsx" hidden></label></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Motor de reglas - juego de cartas políticas.
 * Sin interfaz ni red. Funciona en Node (require) y en navegador (window.Motor).
 * Todo el estado es JSON simple, para poder guardarlo/sincronizarlo después. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Motor = factory();
})(typeof self !== 'undefined' ? self : this, function () {

  // ---------- Constantes ----------
  const ATRIBUTOS = ['imagen', 'experiencia', 'honestidad', 'carisma', 'liderazgo'];

  // De mayor a menor rango (índice menor = rango mayor)
  const RANGOS = ['Presidente', 'Vicepresidente', 'Gobernador', 'Vicegobernador', 'Senador',
    'Diputado', 'Jefe de Gabinete', 'Ministro', 'Legislador', 'Asesor'];

  // Para agregar un evento nuevo: sumar una línea acá (y cargar su cantidad en el JSON).
  // Formas femeninas equivalentes (mismo rango que la masculina)
  const CARGOS_FEM = { 'Presidenta': 'Presidente', 'Vicepresidenta': 'Vicepresidente', 'Gobernadora': 'Gobernador',
    'Vicegobernadora': 'Vicegobernador', 'Senadora': 'Senador', 'Diputada': 'Diputado', 'Jefa de Gabinete': 'Jefe de Gabinete',
    'Ministra': 'Ministro', 'Legisladora': 'Legislador', 'Asesora': 'Asesor' };
  const norm = s => String(s).trim().toLowerCase();
  const RANGO_DE = {}, FORMA_OK = {};
  RANGOS.forEach(r => { RANGO_DE[norm(r)] = r; FORMA_OK[norm(r)] = r; });
  Object.keys(CARGOS_FEM).forEach(f => { RANGO_DE[norm(f)] = CARGOS_FEM[f]; FORMA_OK[norm(f)] = f; });
  const rangoDe = cargo => RANGO_DE[norm(cargo)]; // devuelve el rango canónico o undefined

  const EVENTOS_COMUNES = {
    'Acto': ['carisma'],
    'Nuevo cargo': ['experiencia'],
    'Encuesta': ['imagen'],
    'Escándalo': ['honestidad'],
    'Crisis': ['liderazgo'],
    'Debate': ['carisma', 'experiencia'],
    'Crisis institucional': ['liderazgo', 'experiencia'],
    'Gira internacional': ['imagen', 'liderazgo'],
  };
  const EVENTOS_ELECTORALES = ['PASO', 'Elecciones Generales'];
  const PENALIZACION_INCONGRUENCIA = 8;
  const CARTAS_EN_MANO = 3;

  // ---------- Utilidades ----------
  function crearRng(seed) { // mulberry32: determinista si se pasa seed
    let a = (seed === undefined ? Math.floor(Math.random() * 2 ** 32) : seed) >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function barajar(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const total = c => ATRIBUTOS.reduce((s, k) => s + c[k], 0);
  const idxRango = c => RANGOS.indexOf(rangoDe(c.cargo)); // menor = mejor
  const comparten = (a, b) => a.afiliaciones.some(x => b.afiliaciones.includes(x));

  // ---------- Carga y validación ----------
  /* datos = { colores:{}, cartas:[...], eventos:{ "Acto": 6, ... } }
   * Devuelve { cartas (con id y total), colores, bancoEventos } o lanza Error con todos los problemas. */
  function cargarDatos(datos) {
    const errores = [];
    const colores = datos.colores || {};
    const cartas = (datos.cartas || []).map((c, i) => {
      const nom = `Carta #${i + 1} (${c.nombre || 'sin nombre'})`;
      if (!rangoDe(c.cargo)) errores.push(`${nom}: cargo inválido "${c.cargo}"`);
      if (!c.nombre) errores.push(`${nom}: falta nombre`);
      if (!Array.isArray(c.afiliaciones) || !c.afiliaciones.length) errores.push(`${nom}: falta afiliaciones`);
      else if (!colores[c.afiliaciones[0]]) errores.push(`${nom}: la afiliación principal "${c.afiliaciones[0]}" no tiene color`);
      ATRIBUTOS.forEach(k => {
        if (!Number.isInteger(c[k]) || c[k] < 3 || c[k] > 10) errores.push(`${nom}: ${k} debe ser entero de 3 a 10 (es ${c[k]})`);
      });
      return Object.assign({}, c, { cargo: FORMA_OK[norm(c.cargo)] || c.cargo, id: 'p' + i, total: ATRIBUTOS.reduce((s, k) => s + (c[k] || 0), 0) });
    });
    if (cartas.length % 2 !== 0) errores.push(`La cantidad de políticos debe ser par (hay ${cartas.length})`);
    if (cartas.length < 8) errores.push(`Hacen falta al menos 8 políticos (hay ${cartas.length})`);

    const banco = datos.eventos || {};
    Object.keys(banco).forEach(t => {
      if (!EVENTOS_COMUNES[t]) errores.push(`Evento desconocido en el banco: "${t}"`);
      if (!Number.isInteger(banco[t]) || banco[t] < 0) errores.push(`Cantidad inválida para "${t}"`);
    });
    const N = (cartas.length - 8) / 2;
    const disponibles = Object.values(banco).reduce((s, n) => s + (Number.isInteger(n) ? n : 0), 0);
    if (disponibles < N) errores.push(`El banco tiene ${disponibles} eventos comunes y se necesitan al menos ${N}`);

    if (errores.length) throw new Error('Datos inválidos:\n- ' + errores.join('\n- '));
    return { cartas, colores, bancoEventos: banco };
  }

  // ---------- Armado de partida ----------
  function crearPartida(datos, opciones) {
    opciones = opciones || {};
    const seed = opciones.seed === undefined ? Math.floor(Math.random() * 2 ** 32) : opciones.seed;
    const rng = crearRng(seed);
    const { cartas, bancoEventos } = datos;
    const N = (cartas.length - 8) / 2;

    // Tarjetas individuales del banco, se sortean N
    const tarjetas = [];
    Object.keys(bancoEventos).forEach(t => { for (let i = 0; i < bancoEventos[t]; i++) tarjetas.push(t); });
    const comunes = barajar(tarjetas, rng).slice(0, N);
    const eventos = barajar(comunes.concat(EVENTOS_ELECTORALES), rng);

    const mazo = barajar(cartas, rng).map(c => c.id);
    const manos = [[], []];
    for (let r = 0; r < CARTAS_EN_MANO; r++) for (let j = 0; j < 2; j++) manos[j].push(mazo.shift());

    return {
      seed,
      cartas: Object.fromEntries(cartas.map(c => [c.id, c])), // tabla id -> carta
      eventos,            // lista completa, ya barajada
      turno: 0,           // índice del evento actual
      mazo,
      manos,
      pozos: [[], []],
      jugadas: [null, null], // jugada oculta de cada jugador (ids) hasta que ambos jugaron
      historial: [],
      terminada: false,
    };
  }

  const esElectoral = ev => EVENTOS_ELECTORALES.includes(ev);
  const cantidadAJugar = ev => (esElectoral(ev) ? 2 : 1);
  const eventoActual = p => p.eventos[p.turno];

  // ---------- Resolución ----------
  function cmp(a, b) { return a > b ? 1 : a < b ? -1 : 0; }

  // Resultado: { ganador: 0 | 1 | null, motivo, puntajes:[x,y] }
  function resolverComun(evento, c0, c1) {
    const attrs = EVENTOS_COMUNES[evento];
    const pts = [c0, c1].map(c => attrs.reduce((s, k) => s + c[k], 0));
    let r = cmp(pts[0], pts[1]);
    if (r) return { ganador: r > 0 ? 0 : 1, motivo: 'atributo', puntajes: pts };
    r = cmp(c0.total, c1.total);
    if (r) return { ganador: r > 0 ? 0 : 1, motivo: 'total', puntajes: pts };
    r = cmp(idxRango(c1), idxRango(c0)); // menor índice gana
    if (r) return { ganador: r > 0 ? 0 : 1, motivo: 'rango', puntajes: pts };
    return { ganador: null, motivo: 'empate', puntajes: pts };
  }

  function resolverElectoral(parA, parB) {
    const detalle = [parA, parB].map(par => {
      const suma = par[0].total + par[1].total;
      const incongruente = !comparten(par[0], par[1]);
      return {
        suma, incongruente,
        puntaje: suma - (incongruente ? PENALIZACION_INCONGRUENCIA : 0),
        mejorCarta: Math.max(par[0].total, par[1].total),
        rangos: par.map(idxRango).sort((a, b) => a - b), // [mejor, segundo]
      };
    });
    const [a, b] = detalle;
    const out = (g, motivo) => ({ ganador: g, motivo, puntajes: [a.puntaje, b.puntaje], detalle });
    let r = cmp(a.puntaje, b.puntaje);
    if (r) return out(r > 0 ? 0 : 1, 'suma');
    r = cmp(a.mejorCarta, b.mejorCarta);
    if (r) return out(r > 0 ? 0 : 1, 'mejor carta');
    r = cmp(b.rangos[0], a.rangos[0]);
    if (r) return out(r > 0 ? 0 : 1, 'rango mayor');
    r = cmp(b.rangos[1], a.rangos[1]);
    if (r) return out(r > 0 ? 0 : 1, 'rango segundo');
    return out(null, 'empate');
  }

  // ---------- Flujo de turno ----------
  /* Guarda la jugada (oculta) de un jugador. Si ya jugaron los dos, resuelve y avanza.
   * Devuelve { esperando:true } o { esperando:false, resultado }. */
  function jugar(p, jugador, ids) {
    if (p.terminada) throw new Error('La partida ya terminó');
    if (p.jugadas[jugador]) throw new Error('Este jugador ya jugó en este turno');
    const ev = eventoActual(p);
    if (!Array.isArray(ids) || ids.length !== cantidadAJugar(ev)) throw new Error(`En ${ev} hay que bajar ${cantidadAJugar(ev)} carta(s)`);
    if (new Set(ids).size !== ids.length) throw new Error('Cartas repetidas');
    ids.forEach(id => { if (!p.manos[jugador].includes(id)) throw new Error('Esa carta no está en tu mano'); });

    p.jugadas[jugador] = ids.slice();
    if (!p.jugadas[0] || !p.jugadas[1]) return { esperando: true };
    return { esperando: false, resultado: resolverTurno(p) };
  }

  function resolverTurno(p) {
    const ev = eventoActual(p);
    const [j0, j1] = p.jugadas;
    const cs = ids => ids.map(id => p.cartas[id]);
    const res = esElectoral(ev) ? resolverElectoral(cs(j0), cs(j1)) : resolverComun(ev, cs(j0)[0], cs(j1)[0]);

    // Se sacan de la mano
    [j0, j1].forEach((ids, j) => { p.manos[j] = p.manos[j].filter(id => !ids.includes(id)); });
    // Al pozo: ganador se lleva todo; empate, cada uno las suyas
    if (res.ganador === null) { p.pozos[0].push(...j0); p.pozos[1].push(...j1); }
    else p.pozos[res.ganador].push(...j0, ...j1);

    // Reposición alternada hasta donde alcance el mazo
    const faltan = [CARTAS_EN_MANO - p.manos[0].length, CARTAS_EN_MANO - p.manos[1].length];
    while ((faltan[0] > 0 || faltan[1] > 0) && p.mazo.length) {
      for (let j = 0; j < 2; j++) if (faltan[j] > 0 && p.mazo.length) { p.manos[j].push(p.mazo.shift()); faltan[j]--; }
    }

    const registro = { turno: p.turno, evento: ev, jugadas: [j0.slice(), j1.slice()], resultado: res };
    p.historial.push(registro);
    p.jugadas = [null, null];
    p.turno++;
    if (p.turno >= p.eventos.length) p.terminada = true;
    return registro;
  }

  function resultadoFinal(p) {
    if (!p.terminada) return null;
    const [a, b] = [p.pozos[0].length, p.pozos[1].length];
    return { cartas: [a, b], ganador: a === b ? null : (a > b ? 0 : 1) };
  }

  /* Lo que puede ver un jugador (para filtrar antes de mandar por red):
   * sus cartas, cuántas tiene el rival, y la jugada rival solo si ya se resolvió. */
  function vistaPara(p, jugador) {
    const rival = 1 - jugador;
    return {
      jugador,
      evento: p.terminada ? null : eventoActual(p),
      turno: p.turno, totalTurnos: p.eventos.length,
      miMano: p.manos[jugador].map(id => p.cartas[id]),
      cartasRival: p.manos[rival].length,
      yaJugue: !!p.jugadas[jugador], rivalYaJugo: !!p.jugadas[rival],
      mazoRestante: p.mazo.length,
      miPozo: p.pozos[jugador].map(id => p.cartas[id]),
      pozoRival: p.pozos[rival].map(id => p.cartas[id]),
      ultimoTurno: p.historial[p.historial.length - 1] || null,
      terminada: p.terminada, final: resultadoFinal(p),
    };
  }

  return {
    ATRIBUTOS, RANGOS, CARGOS_FEM, rangoDe, EVENTOS_COMUNES, EVENTOS_ELECTORALES, PENALIZACION_INCONGRUENCIA,
    cargarDatos, crearPartida, eventoActual, esElectoral, cantidadAJugar,

<script>
const $=s=>document.querySelector(s), M=Motor;
let D,P,phase,sel,last,prev=[],pz=[0,0],evKey=-1,modo='bot',peer,conn,emp=false,yjG=false,rjG=false,seedG,racha=[0,0],rachaVis=[0,0],N=['Vos','Bot'];const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function datosEjemplo(){const r=M.crearRng(42),R=()=>3+Math.floor(r()*8);
 const nom=['Juan','María','Carlos','Lucía','Pedro','Ana','Diego','Sofía','Martín','Laura'],ap=['Ejemplo','Prueba','Modelo','Muestra'];

 const col={Libertarios:'#E1C9F0',Derecha:'#FFF9C4',Radicalismo:'#F8CBAD',Peronismo:'#C5E0B4',Kirchnerismo:'#C9DAF8',Izquierda:'#F4A6A6'},ks=Object.keys(col);
 const cartas=Array.from({length:40},(_,i)=>{const a=ks[Math.floor(r()*6)];let b=ks[Math.floor(r()*6)];return{cargo:cg[i%20],nombre:nom[i%10]+' '+ap[Math.floor(i/10)],afiliaciones:a===b?[a]:[a,b],imagen:R(),experiencia:R(),honestidad:R(),carisma:R(),liderazgo:R()}});
 const eventos={};Object.keys(M.EVENTOS_COMUNES).forEach(t=>eventos[t]=8);

const evActual=()=>phase==='revelado'?last.evento:M.eventoActual(P);

function cardEl(c,opts={}){const e=document.createElement('div');e.className='card';e.dataset.id=c.id;
 const ev=evActual(),rel=M.EVENTOS_COMUNES[ev]||[];

let tm=[];const T=(f,ms)=>tm.push(setTimeout(f,ms));

 const t=phase==='revelado'?last.turno+1:P.turno+1;if(phase!=='revelado'){pz=[P.pozos[0].length,P.pozos[1].length];rachaVis=racha.slice()}
 $('#t').textContent=`${t}/${P.eventos.length}`;$('#mz').textContent=P.mazo.length;$('#p0').textContent=pz[0];$('#p1').textContent=pz[1];

 const ev=evActual(),k=K(),rel=M.EVENTOS_COMUNES[ev];

 $('#ev').innerHTML=`<div class="evc${evKey!==t?' nuevo':''}"><small>Evento</small><b>${ev}</b><div>${txt}</div></div>`;evKey=t;
 [['n0',N[0]],['n1',N[1]],['zv',N[0]],['zr',N[1]]].forEach(([i,v])=>$('#'+i).textContent=v);
 const mia=$('#mia'),riv=$('#riv');[...mia.querySelectorAll('.card')].forEach(x=>x.remove());[...riv.querySelectorAll('.card')].forEach(x=>x.remove());
 const msg=$('#msg');msg.innerHTML='';
 if(phase!=='revelado'){

  sel.forEach(id=>{const e=cardEl(P.cartas[id]);e.onclick=()=>{if(phase!=='elegir')return;sel=sel.filter(x=>x!==id);render()};mia.append(e)});
  if(phase==='espera')msg.textContent='Esperando a '+N[1]+'…';else if(sel.length===k){const b=document.createElement('button');b.textContent='Jugar';b.onclick=confirmar;msg.append(b)}else msg.textContent=k===1?'Arrastrá una carta a la mesa (o tocala)':`Elegí ${k} cartas (arrastrá o tocá)`;
 }else{
  last.jugadas[0].forEach(id=>mia.append(cardEl(P.cartas[id])));
  const rc=last.jugadas[1].map(id=>{const e=cardEl(P.cartas[id],{down:true});riv.append(e);return[e,id]});
  T(()=>rc.forEach(([e,id])=>{const n=cardEl(P.cartas[id]);n.classList.add('pop');e.replaceWith(n);if(last.resultado.ganador===1)n.classList.add('win')}),600);
  if(last.resultado.ganador===0)mia.querySelectorAll('.card').forEach(x=>x.classList.add('win'));
  T(()=>{const r=last.resultado,g=r.ganador;rachaVis=racha.slice();pintaRacha();
   msg.innerHTML=`<div><b style="color:${g===0?'var(--ok)':g===1?'var(--ko)':'var(--mut)'}">${g===0?'¡Ganaste el turno!':g===1?'Perdiste el turno':'Empate: cada uno se lleva lo suyo'}</b><br><span style="color:var(--mut);font-size:12px">${r.puntajes[0]} vs ${r.puntajes[1]} · definió: ${r.motivo}</span></div>`;
   const b=document.createElement('button');b.textContent=P.terminada?'Ver resultado':'Siguiente';b.onclick=siguiente;msg.append(b)},1100);
 }
 const mano=$('#mano');mano.innerHTML='';
 P.manos[0].filter(id=>!(phase!=='revelado'&&sel.includes(id))).forEach((id,i)=>{const e=cardEl(P.cartas[id]);
  if(!prev.includes(id)){e.classList.add('deal');e.style.setProperty('--i',i)}
  if(phase==='elegir')arrastrable(e,id);mano.append(e)});

function pintaRacha(){[['riv',1],['mia',0]].forEach(([z,j])=>{const el=$('#'+z),n=rachaVis[j];el.classList.toggle('enfuego',n>=3);let f=el.querySelector('.fuego');if(n>=3){if(!f){f=document.createElement('div');f.className='fuego';el.append(f)}f.innerHTML='<span>🔥</span><b>'+n+'</b>'}else if(f)f.remove()})}
function arrastrable(e,id){
 e.onpointerdown=ev=>{const x0=ev.clientX,y0=ev.clientY;let mv=false;e.setPointerCapture&&e.setPointerCapture(ev.pointerId);e.style.transition='none';e.style.zIndex=50;e.classList.remove('deal');

  e.onpointerup=u=>{e.onpointermove=e.onpointerup=e.onpointercancel=null;$('#mia').classList.remove('hover');
   if(!mv||inside(u.clientX,u.clientY))agregar(id,mv);else{e.style.transition='';e.style.transform='';e.style.zIndex=''}};
  e.onpointercancel=()=>{e.style.transition='';e.style.transform='';e.style.zIndex=''}}}
function agregar(id,drop){const k=K();if(sel.length>=k){if(k===1)sel=[];else return}sel.push(id);render();if(drop&&k===1&&sel.length===1)confirmar()}
function botElige(){const ev=M.eventoActual(P),h=P.manos[1].map(i=>P.cartas[i]),k=M.cantidadAJugar(ev),rel=M.EVENTOS_COMUNES[ev];
 if(k===1)return[h.map(c=>[rel.reduce((s,a)=>s+c[a],0)+c.total/100+Math.random()*3,c]).sort((a,b)=>b[0]-a[0])[0][1].id];
 let best=null;for(let i=0;i<h.length;i++)for(let j=i+1;j<h.length;j++){const s=h[i].total+h[j].total-(h[i].afiliaciones.some(x=>h[j].afiliaciones.includes(x))?0:8)+Math.random()*4;if(!best||s>best[0])best=[s,[h[i].id,h[j].id]]}
 return best[1]}
function siguiente(){const g=last.resultado.ganador;

 setTimeout(()=>{phase=yoJugue()?'espera':'elegir';if(P.terminada){const f=M.resultadoFinal(P);final(f);pz=f.cartas.slice();$('#p0').textContent=pz[0];$('#p1').textContent=pz[1]}else render()},450)}
function final(f){const g=f.ganador,[a,b]=f.cartas,fin=$('#fin');fin.className=g===0?'fw':g===1?'fl':'fe';
 fin.innerHTML=`<div style="font-size:64px">${g===0?'🏆':g===1?'💔':'🤝'}</div><div class="big">${g===0?'¡GANASTE!':g===1?'PERDISTE':'EMPATE'}</div><div class="score">${a} a ${b}</div><button onclick="otra()">Jugar de nuevo</button>`;
 fin.style.display='flex';if(g===0)for(let i=0;i<45;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},85%,60%);animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*1.5}s`;fin.append(c)}}
try{$('#nom').value=localStorage.getItem('nombre')||''}catch(e){}
const yoJugue=()=>modo==='invitado'?yjG:!!P.jugadas[0],rivJugo=()=>modo==='invitado'?rjG:!!P.jugadas[1];
const est=t=>{$('#est').innerHTML=t},aviso=t=>{const a=$('#aviso');a.textContent=t;a.style.display='block';setTimeout(()=>a.style.display='none',6000)},enviar=m=>{if(conn&&conn.open)conn.send(m)};
function sincro(){if(modo==='anfitrion'&&emp)enviar({t:'snap',s:snap(1)})}
function snap(j){const o=1-j,sw=a=>j===0?a:[a[1],a[0]],z=n=>Array(n).fill(0),ids=new Set(P.manos[j]);let l=null;
 if(last){const g=last.resultado.ganador,r=last.resultado;l={turno:last.turno,evento:last.evento,jugadas:sw(last.jugadas),resultado:{ganador:g===null?null:(g===j?0:1),puntajes:sw(r.puntajes),motivo:r.motivo}};l.jugadas.flat().forEach(i=>ids.add(i))}
 const cartas={};ids.forEach(i=>cartas[i]=P.cartas[i]);
 return{colores:D.colores,N:sw(N),racha:sw(racha),yj:!!P.jugadas[j],rj:!!P.jugadas[o],last:l,partida:{seed:P.seed,cartas,eventos:P.eventos.map((e,i)=>i===P.turno?e:null),turno:P.turno,mazo:z(P.mazo.length),manos:[P.manos[j],z(P.manos[o].length)],pozos:[z(P.pozos[j].length),z(P.pozos[o].length)],terminada:P.terminada}}}
function recibe(s){D={colores:s.colores};N=s.N;racha=s.racha;P=s.partida;yjG=s.yj;rjG=s.rj;
 if(P.seed!==seedG){seedG=P.seed;last=s.last;sel=[];prev=[];evKey=-1;rachaVis=[0,0];$('#fin').style.display='none';phase=s.last?'revelado':(yjG?'espera':'elegir')}
 else if(s.last&&(!last||last.turno!==s.last.turno)){last=s.last;sel=[];phase='revelado'}
 else if(phase!=='revelado')phase=yjG?'espera':'elegir';

function otra(){if(modo==='invitado')enviar({t:'otra'});else nueva()}
function resuelto(reg){last=reg;{const g=reg.resultado.ganador;racha=[g===0?racha[0]+1:0,g===1?racha[1]+1:0]}sel=[];phase='revelado';render();sincro()}
function confirmar(){if(sel.length!==K())return;const ids=sel.slice();

 const r=M.jugar(P,0,ids);
 if(modo==='bot')return resuelto(M.jugar(P,1,botElige()).resultado);
 if(r.esperando){phase='espera';render();sincro()}else resuelto(r.resultado)}

const nombre=()=>$('#nom').value.trim()||'Jugador',guarda=()=>{try{localStorage.setItem('nombre',nombre())}catch(e){}};
function deInvitado(m){if(m.t==='hola'){N[1]=String(m.nombre||'Rival').slice(0,16);if(emp){render();sincro()}else empezar()}

function crearSala(){if(typeof Peer==='undefined')return est('No se pudo cargar PeerJS (hace falta internet).');

function unirse(){if(typeof Peer==='undefined')return est('No se pudo cargar PeerJS (hace falta internet).');

 peer.on('open',()=>{conn=peer.connect('pa-'+c,{reliable:true});conn.on('open',()=>{modo='invitado';$('#nv').style.display='none';conn.send({t:'hola',nombre:nombre()});est('Conectado. Esperando que empiece…')});
  conn.on('data',m=>{if(m.t==='snap'){$('#ini').style.display='none';recibe(m.s)}});conn.on('close',()=>aviso('Se perdió la conexión con '+N[1]+'. Recargá la página y entrá de nuevo con el código.'))})}
$('#go').onclick=()=>{modo='bot';N=[nombre(),'Bot'];guarda();empezar()};

{const q=new URLSearchParams(location.search).get('sala');if(q)$('#cod').value=q.toUpperCase()}

function deXlsx(buf){const wb=XLSX.read(buf,{type:'array'}),g=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}),s=v=>String(v).trim();
 const colores={};g('Colores').forEach(r=>{if(s(r['Afiliación'])&&s(r['Color']))colores[s(r['Afiliación'])]=s(r['Color'])});

const leer=async e=>{const f=e.target.files[0];try{if(/\.xlsx$/i.test(f.name)){if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el lector de Excel (hace falta internet).');cargar(deXlsx(await f.arrayBuffer()))}else cargar(JSON.parse(await f.text()))}catch(x){alert(x.message)}e.target.value=''};
$('#f').onchange=$('#f2').onchange=leer;
(async()=>{for(const [n,t] of [['cartas.xlsx','b'],['cartas.json','j']]){let d;try{const r=await fetch(n);if(!r.ok||(t==='b'&&typeof XLSX==='undefined'))continue;d=t==='b'?deXlsx(await r.arrayBuffer()):await r.json()}catch(e){continue}
